appId: com.ultra.terminal
productName: Ultra
directories:
  buildResources: build
  output: release

# Auto-updates (electron-updater): clients fetch latest-mac.yml + the zip from
# the latest GitHub release of this (public) repo. Building with this config
# present also generates release/latest-mac.yml, which must be uploaded to the
# release alongside the artifacts.
publish:
  - provider: github
    owner: petit-software
    repo: ultra

# Only-negative globs keep electron-builder's default include (**/*) and its
# production-dependency pruning, while dropping source/config we don't ship.
files:
  - '!src/**'
  - '!docs/**'
  - '!**/*.map'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!components.json'

# node-pty ships a native .node binary that can't be loaded from inside the asar.
asarUnpack:
  - node_modules/node-pty/**

# Appearance-specific dock icons, loaded at runtime.
extraResources:
  - from: build/icon-light.png
    to: icon-light.png
  - from: build/icon-dark.png
    to: icon-dark.png

# Sign with the auto-discovered "Developer ID Application" cert in the keychain,
# then notarize + staple via the afterSign hook. For an unsigned local build run:
#   CSC_IDENTITY_AUTO_DISCOVERY=false SKIP_NOTARIZE=1 npm run dist:mac
afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true # required for notarization
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false # handled by the afterSign hook (keychain profile)
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64

dmg:
  title: Ultra ${version}

win:
  target: nsis

linux:
  target: AppImage
  category: Development
